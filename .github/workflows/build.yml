name: Build and test

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the app actually changes,
    # so doc-only commits (README, AGENTS.md) don't burn a build.
    paths:
      - "app/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# Read-only at workflow level; nothing publishes yet. The publish job (and
# its write grant) arrives together with the signing keystore.
permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Run unit tests, generator tests, sound pinning and lint
        # Pure-JVM engine + generator tests (no device needed), full lint,
        # and the pin that refuses any hand-edited icon or sound asset.
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :tools:test :tools:checkIcons :tools:checkSounds

      - name: Build release APK
        # Unsigned until the keystore exists; the build itself gates R8 and
        # resource shrinking. bundleRelease and the Play upload arrive with
        # the keystore.
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: puzzlet-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
